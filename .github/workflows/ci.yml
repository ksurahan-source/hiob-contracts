name: ci

# Avoid double runs on open PRs (push + pull_request):
# - feature branches: pull_request only
# - main: push only
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - name: Install locked Python dependencies
        run: uv sync --frozen --dev --no-build --no-install-project
      - name: Run Python tests with branch coverage
        run: >-
          uv run --frozen --dev --no-sync --no-build python -m pytest tests/ -q
          --cov=hiob_contracts --cov-branch --cov-report=term-missing
          --cov-report=xml:coverage.xml --cov-fail-under=100
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ts/package-lock.json
      - name: Install locked TypeScript dependencies
        run: npm ci --ignore-scripts
        working-directory: ts
      - name: Audit TypeScript dependencies
        run: npm audit --audit-level=high
        working-directory: ts
      - name: Run TypeScript tests with branch coverage
        run: npm run test:coverage
        working-directory: ts
      - name: Build TypeScript package
        run: npm run build
        working-directory: ts
      - name: SonarQube Cloud scan
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
